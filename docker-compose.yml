services:
  mongodb:
    image: mongo:7.0
    container_name: welding_twin_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: telemetry_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "30"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: telemetry_kafka
    restart: always
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:29092", "1", "30"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  producer:
    build: .
    container_name: telemetry_producer
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - STREAM_INTERVAL=0.02
      - DATA_DIR=/app/result_data_welding
      - EXTENSION_DIR=/app/result_data_welding/extension
      - METRICS_PORT=8000
      - RUN_ID=${RUN_ID:?RUN_ID must be set once at pipeline startup (e.g. RUN-20261121-001)}
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./result_data_welding:/app/result_data_welding
      - ./logs:/app/logs
    command: python producer.py

  consumer:
    build: .
    container_name: telemetry_consumer
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:29092
      - MONGO_URI=mongodb://mongodb:27017/
      - METRICS_PORT=8001
      - RUN_ID=${RUN_ID:?RUN_ID must be set once at pipeline startup (e.g. RUN-20261121-001)}
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./result_data_welding:/app/result_data_welding
      - ./logs:/app/logs
    command: python consumer.py

  dashboard:
    build: .
    container_name: telemetry_dashboard
    restart: always
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DATA_DIR=/app/result_data_welding
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./result_data_welding:/app/result_data_welding
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: telemetry_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - producer
      - consumer

  grafana:
    image: grafana/grafana:10.4.0
    container_name: telemetry_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mongo_data:
  prometheus_data:
  grafana_data: